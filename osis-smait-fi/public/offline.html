<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070b14" />
  <title>Anda Sedang Offline | OSIS SMAIT Fithrah Insani</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #070b14;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    .bg-glow-1 {
      position: absolute;
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.08) 0%, rgba(15, 23, 42, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(245, 158, 11, 0.22);
      border-radius: 24px;
      padding: 44px 32px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75), 0 0 40px -10px rgba(245, 158, 11, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .icon-container {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px auto;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.18), rgba(217, 119, 6, 0.04));
      border: 1px solid rgba(245, 158, 11, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.25);
    }

    .icon-container svg {
      width: 40px;
      height: 40px;
      color: #fbbf24;
      stroke: #fbbf24;
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #f59e0b;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.25);
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }

    p {
      font-size: 14px;
      line-height: 1.65;
      color: #94a3b8;
      margin-bottom: 32px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    @media (min-width: 480px) {
      .actions {
        flex-direction: row;
        justify-content: center;
      }
    }

    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 13px 26px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #070b14;
      font-weight: 700;
      font-size: 14px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
      transition: all 0.2s ease;
    }

    .btn-retry:hover {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.45);
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 13px 26px;
      background: rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
      font-weight: 600;
      font-size: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-home:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .status-pill {
      margin-top: 28px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #64748b;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #ef4444;
      display: inline-block;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.6);
    }
  </style>
</head>
<body>
  <div class="bg-glow-1"></div>
  <main class="card">
    <div class="icon-container" aria-hidden="true">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M8.88 8.88A9.957 9.957 0 002 12c1.94 4.06 6 7 10 7 1.61 0 3.12-.47 4.41-1.28m2.71-2.72A10.05 10.05 0 0022 12c-1.94-4.06-6-7-10-7-1.25 0-2.45.28-3.53.79" />
      </svg>
    </div>

    <div class="badge">OSIS SMAIT Fithrah Insani &bull; Agora Acta</div>
    <h1>Tidak Ada Koneksi Internet</h1>
    <p>
      Anda sedang tidak terhubung ke jaringan internet. Periksa koneksi data seluler atau Wi-Fi Anda, lalu tekan tombol coba lagi di bawah ini.
    </p>

    <div class="actions">
      <button type="button" class="btn-retry" onclick="window.location.reload()">
        Coba Lagi
      </button>
      <a href="/" class="btn-home">
        Kembali ke Beranda
      </a>
    </div>

    <div class="status-pill">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Terputus dari server</span>
    </div>
  </main>

  <script>
    window.addEventListener('online', function() {
      var text = document.getElementById('statusText');
      var dot = document.getElementById('statusDot');
      if (text && dot) {
        text.innerText = 'Koneksi pulih! Memuat ulang...';
        text.style.color = '#10b981';
        dot.style.backgroundColor = '#10b981';
        dot.style.boxShadow = '0 0 8px rgba(16, 185, 129, 0.8)';
      }
      setTimeout(function() {
        window.location.reload();
      }, 1000);
    });
  </script>
</body>
</html>
