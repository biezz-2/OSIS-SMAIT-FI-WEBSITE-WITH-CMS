name: Security Scanning and Dependency Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  audit:
    name: NPM Audit Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: osis-smait-fi/package-lock.json

      - name: Audit Frontend Dependencies
        working-directory: osis-smait-fi
        run: |
          npm audit --audit-level=critical || true

      - name: Build Check
        working-directory: osis-smait-fi
        run: |
          npm ci
          npm run build
